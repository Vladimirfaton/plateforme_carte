name: Expire outdated access keys

on:
  schedule:
    - cron: '0 1 * * *'  # 01:00 UTC = 02:00 Africa/Porto-Novo
  workflow_dispatch:

jobs:
  expire-keys:
    runs-on: ubuntu-latest
    steps:
      - name: Call expire-keys endpoint
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 90 \
            "${{ secrets.BACKEND_URL }}/api/cron/expire-keys")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Response: $body"
          if [ "$http_code" -ne 200 ]; then
            echo "Échec — code HTTP $http_code"
            exit 1
          fi